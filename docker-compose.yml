services:
  scraper:
    build: .
    restart: unless-stopped
    command: python scheduler.py
    environment:
      AMODOMIO_API_KEY: ${AMODOMIO_API_KEY}
      TARGET_PHONE: ${TARGET_PHONE}
      REPORT_URL: ${REPORT_URL}
      SCRAPE_INTERVAL_MINUTES: "240"
      DB_PATH: /data/listings.db
    volumes:
      - terreno_data:/data

  web:
    build: .
    restart: unless-stopped
    command: gunicorn -w 2 -b 0.0.0.0:8080 scraper.webapp:app
    environment:
      DB_PATH: /data/listings.db
    volumes:
      - terreno_data:/data
    expose:
      - "8080"

volumes:
  terreno_data:
